name: l1-tests

on:
  push:
    branches: [ main, 'release/**', develop, 'topic/**', 'support/**' ]
  pull_request:
    branches: [ main, 'release/**', develop, 'topic/**', 'support/**' ]

env:
  WORK_DIR: ${{github.workspace}}
  DEP_LIB: ${{github.workspace}}/dep_lib
  RDKLOGGER_ROOT: ${{github.workspace}}/Rdklogger
  LD_LIBRARY_PATH: ${{github.workspace}}/install/lib
  PKG_CONFIG_PATH: ${{github.workspace}}/install/lib/pkgconfig
  RDKLOGGER_PREFIX: ${{github.workspace}}/install

jobs:
  l1-tests:
    name: Build rdk_logger with dependecies and execute L1 tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [ gcc, clang ]
        coverage: [ with-coverage, without-coverage ]
        exclude:
          - compiler: clang
            coverage: with-coverage
          - compiler: clang
            coverage: without-coverage
          - compiler: gcc
            coverage: without-coverage
            
    steps: # The list of steps to execute
      - name: Install packages
        run: >
          sudo apt update
          &&
          sudo apt install -y build-essential
          &&
          sudo apt install -y cmake
          &&
          sudo apt install -y tree automake libsqlite3-dev libcurl4-openssl-dev valgrind libgtest-dev lcov clang libsystemd-dev libboost-all-dev libwebsocketpp-dev meson libcunit1 libcunit1-dev


      - name: Build gtest
        run: |
          cd /usr/src/gtest
          sudo cmake CMakeLists.txt
          sudo make
          sudo cp lib/*.a /usr/lib

      - name: Checkout rdkcentral/rdk_logger
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/rdk_logger
          github-server-url: https://github.com/rdkcentral/rdk_logger
          path: "${{env.RDKLOGGER_ROOT}}"

      - name: Build rdk_logger
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{env.DEP_LIB}}
          cd ${{env.DEP_LIB}}
          if [ ! -f log4c-1.2.3.tar.gz ]
          then
          wget https://sourceforge.net/projects/log4c/files/log4c/1.2.3/log4c-1.2.3.tar.gz
          fi
          if [ ! -f log4c-1.2.3 ]
          then
          tar -xzf log4c-1.2.3.tar.gz
          fi
          cd "log4c-1.2.3"
          ./configure "--prefix=${{github.workspace}}/install"
          make
          make install

          echo "\"completed log4c build and installed library\""
          mkdir -p  ${{env.RDKLOGGER_ROOT}}
          cd ${{env.RDKLOGGER_ROOT}}
          aclocal -I cfg
          libtoolize --automake
          autoheader
          automake --foreign --add-missing
          rm -f configure
          autoconf
          export ac_cv_func_malloc_0_nonnull=yes
          export ac_cv_func_memset=yes
           # Enable coverage flags if applicable
          if [ "${{matrix.coverage}}" = "with-coverage" ]; then
            export CFLAGS="-DLOGMILESTONE=ON -DONBOARDING_FILE=ON  --coverage"
            export CXXFLAGS="-DLOGMILESTONE=ON -DONBOARDING_FILE=ON --coverage"
            export LDFLAGS="--coverage"
          fi
          ./configure "--prefix=${{github.workspace}}/install"
          make
          make install

      - name: Build and execute L1 unittesting for rdk_logger
        run: |
          mkdir -p /opt/logs
          sudo touch /opt/logs/rdk_milestones.log
          sudo chmod 666 /opt/logs/rdk_milestones.log
          mkdir -p ${{env.RDKLOGGER_ROOT}}/unittests
          UNITTESTS="${{env.RDKLOGGER_ROOT}}/unittests"
          cp ${{github.workspace}}/install/bin/rdklogctrl ${UNITTESTS}/
          cd ${UNITTESTS}
          if [ "${{matrix.coverage}}" = "with-coverage" ]; then
             cmake -B build -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install/usr  -DDEP_LIB_PATH=${{env.LD_LIBRARY_PATH}} -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_C_FLAGS="--coverage -DLOGMILESTONE=ON"
          else
             cmake -B build -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install/usr -DDEP_LIB_PATH=${{env.LD_LIBRARY_PATH}} -DCMAKE_VERBOSE_MAKEFILE=ON
          fi
          make  -C build
          cmake --install build
          ./build/rdk_logger_gtest
      - name: Collect coverage report
        if: ${{ matrix.coverage == 'with-coverage' }}
        run: |
          lcov --directory ${{env.RDKLOGGER_ROOT}}/src --capture --output-file coverage.info
          lcov --remove coverage.info '/usr/*' "${{env.RDKLOGGER_PREFIX}}/*" --output-file coverage.info 
      - name: Generate the html report
        run: |
            genhtml coverage.info --output-directory /tmp/coverage_report    
      - name: Upload coverage report
        if: ${{ matrix.coverage == 'with-coverage' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: /tmp/coverage_report  
      
      - name: Extract coverage summary
        if: ${{ matrix.coverage == 'with-coverage' && github.event_name == 'pull_request' }}
        id: coverage
        run: |
          lcov --list coverage.info
          lcov --summary coverage.info >>log.txt
          cat log.txt 
          LINE_COVERAGE=$(grep -m1 "lines" log.txt | awk '{print $2}')
          FUNCTION_COVERAGE=$(grep -m1 "functions" log.txt | awk '{print $2}')
          #echo "body=Line coverage: ${LINE_COVERAGE} Function coverage:${FUNCTION_COVERAGE}" >> $GITHUB_OUTPUT
          #echo "body=Line coverage: ${FUNCTION_COVERAGE}" >> $GITHUB_OUTPUT
          echo "line_coverage=${LINE_COVERAGE}" >> $GITHUB_OUTPUT
          echo "function_coverage=${FUNCTION_COVERAGE}" >> $GITHUB_OUTPUT   
          echo "Check: Extracted for output: Line coverage: $LINE_COVERAGE"
          echo "Check: Extracted for output: Function coverage: $FUNCTION_COVERAGE"
      - name: Checkout PR
        uses: actions/checkout@v3

      - name: Run git fetch
        id: lines_added
        run : |
            cd ${{ github.workspace }}
            git fetch origin ${{ github.event.pull_request.base.ref }}
            git fetch origin ${{ github.event.pull_request.head.ref }}
            ADDED_LINES=$(git diff --unified=0 origin/${{ github.event.pull_request.base.ref }} origin/${{ github.event.pull_request.head.ref }} | grep '^+' | grep -v '^+++' | wc -l)
            echo "added_lines=${ADDED_LINES}" >> $GITHUB_OUTPUT
            echo "check : added_lines $ADDED_LINES"
 ### 1. Upload coverage from base branch
      - name: Upload coverage report
        if: ${{ github.event_name != 'pull_request' && matrix.coverage == 'with-coverage' }}
        uses: actions/upload-artifact@v4
        with:
          name: base-coverage-${{ github.ref_name }}
          path: coverage.info

      ### 2. Upload coverage from PR head branch for comment/inspection
      - name: Upload PR branch coverage report
        if: ${{ github.event_name == 'pull_request' && matrix.coverage == 'with-coverage' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-coverage-${{ github.event.pull_request.head.ref }}
          path: coverage.info

      ### 3. If on PR, download base branch coverage and compare!
      - name: Download base branch coverage
        if: ${{ github.event_name == 'pull_request' && matrix.coverage == 'with-coverage' }}
        uses: actions/download-artifact@v4
        with:
          name: base-coverage-${{ github.event.pull_request.base.ref }}
          path: ./base_coverage

      - name: Compare branch coverage
        if: ${{ github.event_name == 'pull_request' && matrix.coverage == 'with-coverage' }}
        id: compare_coverage
        run: |
          echo "Base branch coverage summary:"
          lcov --summary base_coverage/coverage.info
          echo "PR branch coverage summary:"
          lcov --summary coverage.info

          BASE_LINE_COV=$(lcov --summary base_coverage/coverage.info | grep 'lines....:' | awk '{print $2}' | tr -d '%')
          PR_LINE_COV=$(lcov --summary coverage.info | grep 'lines....:' | awk '{print $2}' | tr -d '%')
          DELTA=$(echo "$PR_LINE_COV - $BASE_LINE_COV" | bc)
          echo "base_line_coverage=$BASE_LINE_COV" >> $GITHUB_OUTPUT
          echo "pr_line_coverage=$PR_LINE_COV" >> $GITHUB_OUTPUT
          echo "coverage_delta=$DELTA" >> $GITHUB_OUTPUT

      - name: Post coverage comment on PR
        if: ${{ matrix.coverage == 'with-coverage' && github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Newly added lines compared to develop ✅ : ${{ steps.lines_added.outputs.added_lines }}
            Line coverage ✅ : ${{ steps.coverage.outputs.line_coverage }} 
            Function coverage ✅ : ${{ steps.coverage.outputs.function_coverage }} 
            📊 Coverage Report Comparison
            - Base branch line coverage: ${{ steps.compare_coverage.outputs.base_line_coverage }}%
            - PR branch line coverage: ${{ steps.compare_coverage.outputs.pr_line_coverage }}%
            - Coverage delta: ${{ steps.compare_coverage.outputs.coverage_delta }}%  
            #${{ steps.coverage.outputs.body }}
      

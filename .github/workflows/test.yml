  comment-added-lines:
    name: Comment added lines in PR
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    needs: l1-tests
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Calculate added lines
        id: added_lines
        run: |
          # Find the diff against the base branch
          ADDED_LINES=$(git diff --unified=0 origin/${{ github.event.pull_request.base.ref }}...HEAD | grep '^+' | grep -v '^+++' | wc -l)
          echo "ADDED_LINES=$ADDED_LINES" >> $GITHUB_OUTPUT


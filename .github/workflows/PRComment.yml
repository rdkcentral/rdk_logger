name: PR Comment

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Get number of newly added lines with GitHub CLI
          if: ${{ github.event_name == 'pull_request' }}
          id: lines_added
         run: |
            gh pr diff ${{ github.event.pull_request.number }} --stat > pr_stat.txt
             # Parse added lines from the stats output
            ADDED_LINES=$(grep -Eo '[0-9]+ insertion' pr_stat.txt | awk '{print $1}' | paste -sd+ - | bc)
            echo "added_lines=$ADDED_LINES" >> $GITHUB_OUTPUT
         env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Post a comment on the PR
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            👋 Hello! This is an automated comment from GitHub Actions.
            Let me know if you need help with anything!

